name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]  

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      packages: write  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase the repo name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_HUB_TOKEN }} 
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ github.run_number }}

      - name: Create Release and Tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Automated Build and Release
            - Docker Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_HUB_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy to Mac via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }} 
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH }} 
          script: |
            cd ~/Desktop/Airflow 
            DOCKER="/Applications/Docker.app/Contents/Resources/bin/docker"
            DOCKER_COMPOSE="/Applications/Docker.app/Contents/Resources/bin/docker-compose"
            if [ -f "$DOCKER" ]; then echo "Docker Found"; else echo "Docker NOT Found at $DOCKER"; exit 1; fi
            echo "${{ secrets.GIT_HUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            $DOCKER_COMPOSE pull
            $DOCKER_COMPOSE up -d

