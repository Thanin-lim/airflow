name: Build Push And Deploy Kubernetes

on:
  push:
    branches:
      - test/ci-cd

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Variables
        id: vars
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "image_tag=v${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_HUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.image_name }}:latest
            ghcr.io/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH }}

          script: |
            set -e

            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

            cd ~/Desktop/Airflow

            echo "🚀 Applying Kubernetes manifests..."
            kubectl create namespace airflow --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f k8s/

            echo "🚀 Updating image..."

            kubectl set image deployment/airflow-app \
              airflow-app=ghcr.io/${{ needs.build-and-push.outputs.image_name }}:${{ needs.build-and-push.outputs.image_tag }} \
              -n airflow

            echo "⏳ Waiting for rollout..."

            kubectl rollout status deployment/airflow-app \
              -n airflow \
              --timeout=60s

            echo "✅ Deployment complete"