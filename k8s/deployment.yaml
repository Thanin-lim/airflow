apiVersion: apps/v1
kind: Deployment

metadata:
  name: airflow-app
  namespace: airflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: airflow-app

  template:
    metadata:
      labels:
        app: airflow-app

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: airflow-app

          image: ghcr.io/thanin-lim/airflow:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 5000